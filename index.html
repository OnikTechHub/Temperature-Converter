<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="converter-container">
        <!-- Header Section -->
        <div class="converter-header">
            <h2>Temperature Converter</h2>
            <p>Enter the temperature, select units and submit</p>
        </div>

        <!-- Form Controls -->
        <div class="form-row">
            <input type="number" id="tempInput" placeholder="0.00" step="any">
            
            <select id="fromUnit">
                <option value="" disabled selected>From Unit</option>
                <option value="Celsius">Celsius</option>
                <option value="Fahrenheit">Fahrenheit</option>
                <option value="Kelvin">Kelvin</option>
            </select>

            <select id="toUnit">
                <option value="" disabled selected>To Unit</option>
                <option value="Celsius">Celsius</option>
                <option value="Fahrenheit">Fahrenheit</option>
                <option value="Kelvin">Kelvin</option>
            </select>

            <button id="convertBtn" disabled>Convert</button>
        </div>

        <!-- Result Display Area -->
        <div id="resultBox" class="result-box" style="display: none;">
            <p id="resultText"></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
